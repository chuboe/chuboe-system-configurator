# shellcheck shell=bash
# conf.d/public.conf -- live entries for the `public` backup scope.
#
# Each entry below is rsynced independently into:
#   $RSYNC_BU_PATH/public/<key>/
# Same model as conf.d/private.conf. Public means "data that is OK to
# expose if the rsync.net account is ever compromised" -- keep secrets,
# SSH keys, password stores, etc. in conf.d/private.conf instead.
#
# See conf.d/examples/public.conf.example for typical entries.

declare -gA BU_PUBLIC=(
    # [backup-public]=/home/debian/chuboe-backup-public
)

# Activates this scope. The script iterates SYNC_BACKUP_SCOPES and
# rsyncs every entry in the corresponding BU_<SCOPE> array. Required.
SYNC_BACKUP_SCOPES+=(public)