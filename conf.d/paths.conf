# shellcheck shell=bash
# conf.d/paths.conf -- shared variables for every backup scope.
#
# Sourced first by sync-backup.sh so per-scope conf files can reference
# these variables when declaring their BU_<SCOPE> arrays. Do NOT rename
# this file -- the script explicitly sources paths.conf before any other
# conf.d/*.conf file.
#
# ACTION: update these variables for your host before running.

# Per-host identifier. Each host's backups land under a uniquely-named
# subdir on the rsync.net remote so multiple hosts can share one
# rsync.net account without colliding.
BU_REMOTE_NAME=chuboe-sand-01

# Primary non-root user. The commented-out example entries in
# conf.d/examples/private.conf.example reference $USER_HOME paths under
# this account.
USER_PRIMARY=debian
USER_HOME=/home/$USER_PRIMARY

# Local directories this script owns / stages into. Backs up the
# contents via the [backup-private], [sync-backup.sh], etc. entries in
# conf.d/private.conf.
OPT_BACKUP_DIR="/opt/chuboe-system-backup"
OPT_BACKUP_PRIVATE_DIR="/opt/chuboe-backup-private"

#ACTION - update these variables
# rsync.net account credentials. See chuboe-system-configurator README
# for how to set up the SSH key.
RSYNC_BU_USER=SomeRsyncUser
RSYNC_BU_URL=SomeRsyncUser.rsync.net

# Destination layout version. Bump when destination paths change so old
# and new trees can coexist on the remote during migration.
#   v01 = monolithic, basename-keyed at  $BU_REMOTE_NAME/backup/<basename>/...
#   v02 = per-entry, scope/key at      $BU_REMOTE_NAME/backup-v02/<scope>/<key>/...
RSYNC_BU_PATH=$BU_REMOTE_NAME/backup-v02