# shellcheck shell=bash
# conf.d/private.conf -- live entries for the `private` backup scope.
#
# Each entry below is rsynced independently into:
#   $RSYNC_BU_PATH/private/<key>/
# A missing or broken-symlink source is skipped (logged to syslog) and
# does not affect any other entry.
#
# To add an entry:
#   1. Add a [key]=/path line inside the BU_PRIVATE=( ... ) block below.
#   2. Make sure the source path exists and is readable as root.
#   3. Run sync-backup.sh and confirm syslog shows no "skipping" line.
#
# To disable an entry without deleting it, prefix with #:  #[key]=/path
#
# To add a new private-style scope, copy this file to e.g.
# conf.d/encrypted.conf and rename BU_PRIVATE -> BU_ENCRYPTED, then add
# `SYNC_BACKUP_SCOPES+=(encrypted)` at the bottom.

declare -gA BU_PRIVATE=(
    # Backs up $OPT_BACKUP_PRIVATE_DIR (operator staging area) directly
    # into the `backup-private` remote subdir. (In v01 this entry pointed
    # at the local staging dir, which no longer exists.)
    [backup-private]="$OPT_BACKUP_PRIVATE_DIR"

    # Self-backup of this script.
    [sync-backup.sh]="$OPT_BACKUP_DIR/sync-backup.sh"
    [sync-lastupdate.txt]="$OPT_BACKUP_DIR/sync-lastupdate.txt"
    [system-config-readme.md]="$OPT_BACKUP_DIR/readme.md"
)

# Activates this scope. The script iterates SYNC_BACKUP_SCOPES and
# rsyncs every entry in the corresponding BU_<SCOPE> array. Required.
SYNC_BACKUP_SCOPES+=(private)